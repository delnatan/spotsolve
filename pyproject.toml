[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "spotsolve"
version = "0.2.0"
description = "Multi-emitter spot detection, localization and tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Elnatan", email = "delnatan@gmail.com" }]
keywords = [
    "microscopy",
    "single-molecule",
    "localization",
    "spot-detection",
    "point-spread-function",
    "bayesian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "polars>=1.0",
]

[project.optional-dependencies]
# What `scripts/` needs on top of the library: image I/O and the audit panels.
scripts = [
    "tifffile>=2023.1.1",
    "matplotlib>=3.7",
]
# Build tooling for local development.
dev = ["maturin>=1.14,<2"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/delnatan/spotsolve"
Repository = "https://github.com/delnatan/spotsolve"

[tool.maturin]
manifest-path = "rust/spotsolve-py/Cargo.toml"
python-source = "src"
python-packages = ["spotsolve", "spotsolve_rs"]
module-name = "spotsolve_rs.spotsolve_rs"
features = ["extension-module"]
locked = true
include = [
    { path = "tests/**/*", format = "sdist" },
    { path = "scripts/**/*.py", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "rust/Cargo.lock", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The shared microscopy environment exposes napari pytest plugins globally.
# spotsolve does not use napari; prevent those plugins from importing it (and
# writing its GUI theme cache) during this project's tests.
addopts = ["-p", "no:napari", "-p", "no:napari-plugin-engine"]
