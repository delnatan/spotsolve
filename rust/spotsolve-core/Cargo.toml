[package]
name = "spotsolve-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The entire runtime dependency budget. libm is a pure-Rust port of musl's math,
# so erf is bit-identical on macOS, Linux and Windows. No BLAS: the dense
# systems here are a few dozen parameters, where a library's call overhead
# exceeds the arithmetic.
libm = "0.2"

[dev-dependencies]
# Test-only: reads tests/fixtures/*.json. Never linked into the extension.
serde_json = "1"
